<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./images/rdln-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RdLn Beta - Professional Text Comparison Redlining with OCR</title>
    <meta name="description" content="Lightning-fast, professional-grade document comparison tool for corporate lawyers and legal professionals. Features advanced OCR for screenshot-to-text conversion and beautiful Apple-inspired themes with glassmorphic effects. Client-side processing ensures complete confidentiality." />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RdLn" />
    <link rel="apple-touch-icon" href="./images/rdln-logo.png" />
    
    <!-- Local fonts instead of CDN - for offline functionality -->
    <link rel="stylesheet" href="./fonts/fonts.css">
    
    <!-- Electron environment flag -->
    <script>
      // PERFORMANCE PROFILING: Track renderer process startup
      console.time('🎨 RENDERER-INIT');
      console.log('⏱️  RENDERER: Script execution started at', new Date().toISOString());
      
      window.isElectron = true;
      window.isOffline = true;
      
      // Track when DOM content is loaded
      document.addEventListener('DOMContentLoaded', () => {
        console.timeEnd('🎨 RENDERER-INIT');
        console.time('⚛️  REACT-LOAD');
        console.log('⏱️  RENDERER: DOMContentLoaded at', new Date().toISOString());
      });
      
      // Track when everything is loaded
      window.addEventListener('load', () => {
        console.timeEnd('⚛️  REACT-LOAD');
        console.log('✅ RENDERER: Window fully loaded at', new Date().toISOString());
      });

      // Minimal crash reporter for early failures (helps when bundle fails to load)
      window.addEventListener('error', (e) => {
        try {
          const msg = e?.error?.stack || e?.message || 'Unknown renderer error';
          console.error('❌ RENDERER ERROR:', msg);
          const el = document.getElementById('early-error');
          if (el) {
            el.textContent = String(msg);
            el.parentElement?.classList.remove('hidden');
          }
        } catch {}
      });

      window.addEventListener('unhandledrejection', (e) => {
        try {
          const msg = (e?.reason && (e.reason.stack || e.reason.message)) || 'Unhandled promise rejection';
          console.error('❌ RENDERER PROMISE REJECTION:', msg);
          const el = document.getElementById('early-error');
          if (el) {
            el.textContent = String(msg);
            el.parentElement?.classList.remove('hidden');
          }
        } catch {}
      });
    </script>
    <!-- ASSETS_PLACEHOLDER -->
  </head>
<body style="background: linear-gradient(135deg, #1c1917 0%, #292524 100%);">
    <div id="root"></div>
    <!-- Early error surface for white-screen debugging in packaged builds -->
    <div id="early-error-wrap" class="hidden" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:99999;">
      <div style="max-width:780px;width:90%;background:#111827;color:#f9fafb;border:1px solid #374151;border-radius:12px;padding:16px;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial">
        <div style="font-weight:600;margin-bottom:8px;">Renderer error</div>
        <pre id="early-error" style="white-space:pre-wrap;word-wrap:break-word;margin:0;font-size:12px;line-height:1.4"></pre>
      </div>
    </div>
    
    <!-- Electron-specific scripts -->
    <script>
      // Listen for Electron file drop events
      if (window.electronAPI) {
        document.addEventListener('electron-file-drop', (event) => {
          console.log('📁 File dropped via Electron:', event.detail);
          
          // Find text input panels and trigger file processing
          const panels = document.querySelectorAll('[data-text-input-panel]');
          panels.forEach(panel => {
            const customEvent = new CustomEvent('tauri-file-processed', {
              detail: {
                file: event.detail.file,
                panelTitle: panel.getAttribute('data-panel-title') || 'unknown'
              }
            });
            panel.dispatchEvent(customEvent);
          });
        });
      }
      
      // Override Tesseract.js configuration for offline mode
      window.TESSERACT_CONFIG = {
        langPath: './tessdata/',
        // Use directory path to enable SIMD/LSTM auto-selection when variants are present
        corePath: './tesseract',
        workerPath: './tesseract/worker.min.js',
        preferLocal: true
      };
    </script>
  </body>
</html>
