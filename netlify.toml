[build]
  command = "npm ci --production=false && npm run build:web"
  publish = "dist"
  environment = { NODE_VERSION = "20" }

[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/tesseract/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/tessdata/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
