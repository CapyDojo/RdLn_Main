<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy Verification Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .test-section { border: 1px solid #ddd; padding: 20px; margin: 15px 0; border-radius: 8px; }
        .log { background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 10px 0; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        button { padding: 12px 24px; margin: 8px; cursor: pointer; border: none; border-radius: 5px; font-size: 14px; }
        .btn-primary { background: #2196F3; color: white; }
        .btn-secondary { background: #757575; color: white; }
        .success { color: #4CAF50; font-weight: bold; }
        .error { color: #f44336; font-weight: bold; }
        .info { color: #2196F3; }
    </style>
</head>
<body>
    <h1>🔧 Strategy Verification Test</h1>
    
    <div class="test-section">
        <h2>Configuration Test</h2>
        <p>This test verifies that the strategy switching mechanism is working correctly.</p>
        
        <button class="btn-primary" onclick="testSmartStrategy()">Test Smart Strategy</button>
        <button class="btn-secondary" onclick="testTraditionalStrategy()">Test Traditional Strategy</button>
        <button class="btn-secondary" onclick="checkCurrentConfig()">Check Current Config</button>
        
        <div class="log" id="testLog"></div>
    </div>

    <script type="module">
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logElement = document.getElementById('testLog');
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            logElement.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            logElement.scrollTop = logElement.scrollHeight;
            console.log(`[${timestamp}] ${message}`);
        }
        
        window.checkCurrentConfig = function() {
            log('🔍 Checking current configuration...', 'info');
            
            // Check if DETECTION_OPTIMIZATIONS exists on window
            if (window.DETECTION_OPTIMIZATIONS) {
                log(`✅ window.DETECTION_OPTIMIZATIONS exists`, 'success');
                log(`📊 enableSmartDefault: ${window.DETECTION_OPTIMIZATIONS.enableSmartDefault}`, 'info');
                log(`📊 englishFirstThreshold: ${window.DETECTION_OPTIMIZATIONS.englishFirstThreshold}`, 'info');
            } else {
                log(`❌ window.DETECTION_OPTIMIZATIONS not found`, 'error');
            }
            
            // Try to import and check the module
            import('./src/config/ocrConfig.js').then(({ DETECTION_OPTIMIZATIONS }) => {
                log(`📦 Imported DETECTION_OPTIMIZATIONS.enableSmartDefault: ${DETECTION_OPTIMIZATIONS.enableSmartDefault}`, 'info');
            }).catch(error => {
                log(`❌ Failed to import config: ${error.message}`, 'error');
            });
        };
        
        window.testSmartStrategy = function() {
            log('🚀 Testing Smart Strategy Configuration...', 'info');
            
            // Set smart strategy
            if (!window.DETECTION_OPTIMIZATIONS) {
                window.DETECTION_OPTIMIZATIONS = {};
            }
            window.DETECTION_OPTIMIZATIONS.enableSmartDefault = true;
            
            log(`✅ Set enableSmartDefault = true`, 'success');
            log(`🔍 Verification: window.DETECTION_OPTIMIZATIONS.enableSmartDefault = ${window.DETECTION_OPTIMIZATIONS.enableSmartDefault}`, 'info');
            
            // Test the detection logic path
            const enableSmartDefault = (typeof window !== 'undefined' && window.DETECTION_OPTIMIZATIONS?.enableSmartDefault !== undefined) 
                ? window.DETECTION_OPTIMIZATIONS.enableSmartDefault 
                : true; // fallback
            
            log(`🎯 Detection logic would use: ${enableSmartDefault ? 'SMART' : 'TRADITIONAL'} strategy`, enableSmartDefault ? 'success' : 'error');
        };
        
        window.testTraditionalStrategy = function() {
            log('🔄 Testing Traditional Strategy Configuration...', 'info');
            
            // Set traditional strategy
            if (!window.DETECTION_OPTIMIZATIONS) {
                window.DETECTION_OPTIMIZATIONS = {};
            }
            window.DETECTION_OPTIMIZATIONS.enableSmartDefault = false;
            
            log(`✅ Set enableSmartDefault = false`, 'success');
            log(`🔍 Verification: window.DETECTION_OPTIMIZATIONS.enableSmartDefault = ${window.DETECTION_OPTIMIZATIONS.enableSmartDefault}`, 'info');
            
            // Test the detection logic path
            const enableSmartDefault = (typeof window !== 'undefined' && window.DETECTION_OPTIMIZATIONS?.enableSmartDefault !== undefined) 
                ? window.DETECTION_OPTIMIZATIONS.enableSmartDefault 
                : true; // fallback
            
            log(`🎯 Detection logic would use: ${enableSmartDefault ? 'SMART' : 'TRADITIONAL'} strategy`, !enableSmartDefault ? 'success' : 'error');
        };
        
        // Initialize
        log('🔧 Strategy Verification Test loaded', 'success');
        log('📋 Instructions:', 'info');
        log('1. Click "Check Current Config" to see initial state', 'info');
        log('2. Click "Test Smart Strategy" to verify smart config works', 'info');
        log('3. Click "Test Traditional Strategy" to verify traditional config works', 'info');
        
        // Auto-check on load
        setTimeout(() => {
            window.checkCurrentConfig();
        }, 1000);
    </script>
</body>
</html>
