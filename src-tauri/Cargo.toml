[package]
name = "rdln"
version = "1.0.0"
description = "RdLn - Professional Document Comparison Tool"
authors = ["RdLn Team"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
tauri = { version = "2.7.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Tauri-specific OCR dependencies (using system Tesseract CLI)
base64 = "0.21"
tokio = { version = "1.0", features = ["process", "fs"] }
uuid = { version = "1.0", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
